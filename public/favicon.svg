  <!-- GENERADO POR scripts/logo.py. Versión sólida: a 16 px el filete fino del
       isotipo se deshace, así que en la pestaña va el disco lleno.

       Va a sangre, sin pastilla ni margen: con un recuadro alrededor, a 16 px
       el monograma se queda en 13 y deja de leerse.

       No cambia con el estilo del SITIO —un archivo estático no ve las
       variables de index.css— pero sí con el del NAVEGADOR: sobre una barra de
       pestañas oscura, un disco de tinta oscura es una mancha. -->
  <style>
